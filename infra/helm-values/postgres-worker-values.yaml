# PostgreSQL for Worker
auth:
  postgresPassword: "worker-password"
  username: "worker"
  password: "worker-password"
  database: "workerdb"

primary:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 5Gi
  podLabels:
    app: postgres-worker
    sidecar.istio.io/inject: "false"

architecture: standalone

metrics:
  enabled: false
