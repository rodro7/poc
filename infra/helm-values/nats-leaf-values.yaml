# NATS Leaf Nodes - 3 replicas connecting to JetStream cluster
config:
  cluster:
    enabled: true
    replicas: 3

  leafnodes:
    enabled: true
    remotes:
      - url: "nats://nats:7422"

  jetstream:
    enabled: false

container:
  merge:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 250m

podTemplate:
  merge:
    metadata:
      labels:
        app: nats-leaf
        sidecar.istio.io/inject: "false"
