apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: poc
  labels:
    app: worker
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        version: v1
    spec:
      containers:
        - name: worker
          image: localhost:5000/worker:latest
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: database-url
            - name: REDIS_URL
              value: "redis://:redis-password@redis-master:6379/1"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: NEO4J_URI
              value: "bolt://neo4j:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: "neo4j-password"
            - name: PHOENIX_URL
              value: "http://arize-phoenix:6006"
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
