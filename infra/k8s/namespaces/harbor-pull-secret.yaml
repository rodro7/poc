# Harbor image pull secret for the poc namespace.
# This manifest is a template - the actual secret is created by install.sh
# using 'kubectl create secret docker-registry' with live credentials.
#
# To recreate manually:
#   kubectl create secret docker-registry harbor-pull-secret \
#     --namespace=poc \
#     --docker-server=harbor.local \
#     --docker-username=admin \
#     --docker-****** \
#     --docker-email=admin@example.com \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull-secret
  namespace: poc
type: kubernetes.io/dockerconfigjson
data:
  # Populated at runtime by install.sh - do not edit manually
  .dockerconfigjson: e30K
